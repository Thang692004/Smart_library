<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Library Curator – Người Giám Tuyển Thư Viện 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== Biến màu & Giao diện sách cổ điển sang trọng ===== */
:root{
  --bg1:#fbf6f0;--bg2:#f6ebe4;--bg3:#f1e9df;
  --card:#ffffff;--ink:#2a1d17;--mut:#7a6a60;--bd:#eadfd2;
  --p1:#1f3a5f;--p2:#b8995a;--acc:#1f3a5f;--onacc:#ffffff;
  --gold:#b8995a;--new:#fff4de;--newbd:#d9b25f;--warn:#c2410c;
  --ts:85%;--tl:92%;--tk:30%;
  --sh:0 6px 20px rgba(60,35,20,.08);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#17110d;--bg2:#1b1410;--bg3:#120e0b;
    --card:#241b16;--ink:#f4ebe2;--mut:#b7a79a;--bd:#3b2e26;
    --p1:#d8b878;--p2:#b8995a;--acc:#d8b878;--onacc:#1a120c;
    --gold:#d8b878;--new:#3a2e14;--newbd:#b8995a;--warn:#ffa56b;
    --ts:35%;--tl:25%;--tk:88%;--sh:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg3))}
body{
  color:var(--ink);
  font:14.5px/1.6 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
  max-width:820px;margin:0 auto;
}

/* Header */
header{
  display:flex;align-items:center;gap:14px;
  margin:10px 12px 0;padding:16px 20px;
  border-radius:16px;
  background:linear-gradient(120deg,#1c120d,#3a2218 62%,#51301f);
  color:#f7efe6;
  border:1px solid rgba(184,153,90,.4);
  box-shadow:var(--sh);
}
.logo{
  flex:none;width:48px;height:48px;border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(216,184,120,.5);
  display:grid;place-items:center;
}
.ht{flex:1;min-width:0}
h1{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.3px;margin:0}
h1::after{content:"";display:block;width:42px;height:2px;background:#d8b878;margin:5px 0 4px}
header p{margin:0;font-size:12.5px;opacity:.88}
.pill{
  font:inherit;font-size:13px;font-weight:500;letter-spacing:.2px;
  padding:8px 13px;border-radius:99px;
  background:transparent;border:1px solid #d8b878;color:#f0dcae;
  cursor:pointer;transition:background .2s;white-space:nowrap;
}
.pill:hover{background:rgba(216,184,120,.18)}

/* Tabs điều hướng */
#tabs{display:flex;gap:0;padding:10px 14px 0;border-bottom:1px solid var(--bd);margin:0 12px}
#tabs button{
  flex:1;font:inherit;font-size:14px;font-weight:500;
  padding:10px 6px;border:0;border-bottom:2px solid transparent;border-radius:0;
  background:transparent;color:var(--mut);cursor:pointer;transition:all .2s;
}
#tabs button.on{background:transparent;color:var(--ink);border-bottom-color:var(--gold);font-weight:600}

/* Bảng đánh giá hệ thống (MTB 1.3.a) */
#panel{
  margin:10px 12px 0;padding:14px 16px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--bd);
  box-shadow:var(--sh);max-height:46vh;overflow:auto;
}
#panel h2,.q h3,#quizv>h3,#qres h3{font-family:var(--serif);font-weight:600;margin:0 0 6px}
#panel h2{font-size:17px}
.hint{color:var(--mut);font-size:12.5px;margin:4px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600}

/* Khu vực Chat */
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;padding:16px 14px 6px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{
  flex:none;width:34px;height:34px;border-radius:50%;
  background:var(--card);border:1.5px solid var(--gold);
  display:grid;place-items:center;
}
.m{
  max-width:88%;padding:11px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--bd);
  border-bottom-left-radius:4px;box-shadow:var(--sh);
}
.me .m{
  background:var(--acc);color:var(--onacc);border:0;
  border-bottom-left-radius:14px;border-bottom-right-radius:4px;
}

/* Thẻ sách gợi ý */
.book{
  display:block;margin-top:10px;padding:12px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--bd);
  border-left:4px solid hsl(var(--h) 45% 48%);box-shadow:var(--sh);
}
.book.new{background:var(--new);border-color:var(--newbd);border-left-color:var(--newbd)}
.bh{display:flex;gap:12px;align-items:flex-start}
.bt{min-width:0;flex:1}
.cv{
  flex:none;width:48px;height:68px;border-radius:2px 6px 6px 2px;
  background:linear-gradient(135deg,hsl(var(--h) 45% 40%),hsl(var(--h) 50% 24%));
  display:grid;place-items:center;font-size:20px;
  box-shadow:2px 3px 8px rgba(0,0,0,.28),inset 3px 0 0 rgba(255,255,255,.2);
}
.book b{display:block;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.3}
.book small{color:var(--mut);font-size:12px}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
.tg{
  font-size:11.5px;padding:2px 8px;border-radius:6px;
  background:var(--bg2);color:var(--mut);border:1px solid var(--bd);
}
.why{font-size:13.5px;color:var(--ink);opacity:.92}
.badge{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.2px;
  padding:2px 8px;border-radius:4px;
  background:var(--gold);color:#241505;margin-right:6px;
}
.badge.w{background:var(--warn);color:#fff}

/* Đánh giá sao */
.stars{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:12px;color:var(--mut)}
.stars span{margin-right:4px}
.star{font-size:19px;line-height:1;padding:2px;border:0;background:none;color:var(--bd);cursor:pointer;transition:transform .1s}
.star:hover{transform:scale(1.15)}
.star.on{color:#f5b301}

/* Hiệu ứng đang gõ */
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--gold);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}}

/* Gợi ý nhanh & Form nhập */
#chips{padding:6px 14px 8px;display:flex;gap:7px;overflow-x:auto}
.chip{
  flex:none;font:inherit;font-size:13px;padding:6px 12px;
  border-radius:99px;border:1px solid var(--bd);
  background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .2s;
}
.chip:hover{border-color:var(--gold)}
form{display:flex;gap:8px;padding:6px 14px 8px}
input,textarea{
  font:inherit;padding:11px 14px;border-radius:99px;
  border:1.5px solid var(--bd);background:var(--card);color:var(--ink);
}
input{flex:1;min-width:0}
input:focus,textarea:focus{outline:0;border-color:var(--gold)}
button.go{
  font:inherit;font-weight:600;letter-spacing:.3px;
  padding:0 20px;border:0;border-radius:99px;
  background:var(--acc);color:var(--onacc);cursor:pointer;transition:filter .2s;
}
button.go:hover{filter:brightness(1.12)}
button.go:disabled{opacity:.6;cursor:not-allowed}

/* Khu vực Trắc nghiệm */
#quizv{overflow-y:auto;padding:12px 14px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.q h3{font-size:15.5px;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{
  font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;
  border:1px solid var(--bd);background:var(--bg2);color:var(--ink);cursor:pointer;transition:all .15s;
}
.opt:hover{border-color:var(--gold)}
.opt.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
button.big{width:100%;padding:13px;font-size:15px}
.acts{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}
.acts .chip{font-weight:600}
.ai{white-space:pre-wrap;line-height:1.65}
.src{font-size:11.5px;color:var(--mut);margin-top:8px;padding-top:6px;border-top:1px dashed var(--bd);white-space:normal}
#fav{width:100%;border-radius:12px}
textarea{width:100%;border-radius:12px;resize:vertical}
.btnrow{display:flex;gap:8px;align-items:stretch;margin-top:4px}
.btnrow .go{flex:1}
.btnrow .chip{font-weight:600}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Footer */
footer{padding:2px 16px 10px;font-size:11.5px;line-height:1.5;color:var(--mut);text-align:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo"></div>
  <div class="ht">
    <h1>Smart Library Curator</h1>
    <p>Người Giám Tuyển Thư Viện 4.0 · <span id="n"></span> đầu sách</p>
  </div>
  <button id="stb" class="pill" type="button">📊 Đánh giá</button>
</header>

<nav id="tabs">
  <button data-t="chat" class="on" type="button">💬 Chat với AI</button>
  <button data-t="quiz" type="button">📝 Trắc nghiệm gu đọc</button>
</nav>

<section id="panel" hidden></section>

<main id="chatv" class="pane">
  <div id="log"></div>
  <div id="chips"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Kể sở thích, tâm trạng, hoặc nhập 1 sách/phim bạn mê…">
    <button id="sendBtn" class="go" type="submit">Gửi ➤</button>
  </form>
</main>

<main id="quizv" class="pane" hidden></main>

<footer>
  Gợi ý chỉ để tham khảo, bạn là người quyết định 💛 Câu bạn gõ trong “Chat với AI” được gửi tới Gemini AI để tư vấn, nên không nhập thông tin cá nhân. Hệ thống không lưu lịch sử đọc (Stateless Session). <a href="#" id="clr" style="color:inherit;text-decoration:underline">Xóa cuộc trò chuyện</a>
</footer>

// Chuyển đổi dữ liệu thành danh sách đối tượng sách
const B = D.flatMap(([c, s]) => s.split("\n").map(l => {
  const [t, a, k] = l.split("|");
  return { t, a, k, g: c };
}));

// Bộ lọc cảnh báo độ tuổi (đạo đức AI)
const MATURE = /^(Làm Đĩ|Bố Già|IT |Sự Im Lặng|Rừng Na Uy|Nỗi Buồn Chiến Tranh|Người Yêu Dấu|Chuyện Người Tùy Nữ|Người Đua Diều|Mù Lòa|Không Còn Là Con Người|Ulysses|Lò Sát Sinh Số 5|Con Đường)/;
document.getElementById("n").textContent = B.length;

// ================= BỘ MÁY GỢI Ý TF-IDF + COSINE SIMILARITY =================
const STOP = new Set("la va cho toi minh em thich muon doc sach nhung cac co khong mot nao nhe goi y ve nhu cuon hay can tim duoc cua voi rat giong me hoc".split(" "));
const N = s => s.toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const words = s => N(s).split(" ").filter(w => w.length > 1 && !STOP.has(w));
const grams = s => {
  const t = words(s), g = [...t];
  for (let i = 0; i < t.length - 1; i++) g.push(t[i] + "_" + t[i + 1]);
  return g;
};
const cos = (a, b) => {
  let d = 0, x = 0, y = 0;
  for (const k in a) { x += a[k] * a[k]; if (b[k]) d += a[k] * b[k]; }
  for (const k in b) y += b[k] * b[k];
  return x && y ? d / Math.sqrt(x * y) : 0;
};
const mk = txt => {
  const docs = B.map(txt), df = {};
  docs.forEach(d => new Set(d).forEach(w => df[w] = (df[w] || 0) + 1));
  const idf = w => Math.log((B.length + 1) / (df[w] + 1)) + 1;
  const vec = g => {
    const v = {};
    g.forEach(w => { if (df[w]) v[w] = (v[w] || 0) + idf(w); });
    return v;
  };
  return { vec, dv: docs.map(vec) };
};

const VER = { B: mk(b => grams([b.g, b.k, b.k, b.t, b.a].join(" "))) };
let cur = "B", vec = VER.B.vec, dv = VER.B.dv;
const alias = t => {
  const m = t.match(/^(.*?)\s*\((.*)\)\s*$/);
  return (m ? [m[1], m[2]] : [t]).flatMap(x => [x, x.split(":")[0]]);
};
const mature = b => MATURE.test(b.t);
const shuffle = a => [...a].sort(() => Math.random() - .5);

// Hàm gợi ý lai ghép kèm suất "Khám phá" chống bong bóng lọc
function recommend(text) {
  const nq = " " + N(text) + " ";
  if (/ ngau nhien /.test(nq)) {
    const seen = new Set(), pick = [];
    shuffle([...B.keys()]).forEach(i => {
      if (pick.length < 3 && !seen.has(B[i].g) && !mature(B[i])) {
        seen.add(B[i].g);
        pick.push({ i, why: "Chọn ngẫu nhiên từ nhóm “" + B[i].g + "” để bạn thử trải nghiệm mới." });
      }
    });
    return { intro: "Đây là 3 cuốn sách ngẫu nhiên, mỗi cuốn thuộc một nhóm khác nhau:", top: pick };
  }

  const liked = B.findIndex(b => alias(b.t).some(x => {
    const n = N(x);
    return n.length >= 9 ? nq.includes(" " + n + " ") : n.length >= 4 && (nq.includes(" giong " + n + " ") || nq.includes(" nhu " + n + " "));
  }));

  const qv = vec(grams(text)), qw = new Set(words(text));
  if (liked >= 0) {
    const lv = dv[liked];
    for (const k in lv) qv[k] = (qv[k] || 0) + lv[k];
    words(B[liked].k).forEach(w => qw.add(w));
  }

  const sc = dv.map((v, i) => ({ i, s: i === liked ? -1 : cos(qv, v) })).sort((a, b) => b.s - a.s);
  const why = i => {
    const m = B[i].k.split(", ").filter(k => words(k).some(w => qw.has(w)));
    return m.length ? "Vì trùng mạch chủ đề/cảm xúc: " + m.join("; ") + "." : "Cùng nhóm chủ đề hoặc phong cách với điều bạn mô tả.";
  };

  if (sc[0].s <= 0.01) {
    return { intro: "Mình chưa bắt được gu đọc của bạn. Thử nêu thể loại, tâm trạng hoặc nhập “giống” một cuốn sách bạn từng thích, hoặc gõ “ngẫu nhiên” nhé!", top: [] };
  }

  const top = sc.filter(x => x.s > 0.01).slice(0, 3).map(x => ({ i: x.i, why: why(x.i) }));
  const used = new Set(top.map(t => B[t.i].g));
  const cand = sc.filter(x => x.s >= 0 && !used.has(B[x.i].g) && !mature(B[x.i]));
  const ex = cand.find(x => x.s > 0.01) || shuffle(cand)[0];

  return {
    intro: liked >= 0 ? "Vì bạn thích “" + B[liked].t + "”, mình giám tuyển cho bạn:" : "Dựa trên gu đọc bạn vừa chia sẻ, mình gợi ý:",
    top,
    explore: ex && {
      i: ex.i,
      why: "Khác danh mục với các cuốn trên để giúp bạn thoát khỏi “bong bóng lọc”. " + (ex.s > 0.01 ? why(ex.i) : "Hãy thử như một lựa chọn mở rộng chân trời.")
    }
  };
}

  if (mature(b)) w.appendChild(el("span", "badge w", "🔞 Nên hỏi thủ thư/GV"));
  w.append(p.why);
  c.appendChild(w);

  const s = el("div", "stars");
  s.appendChild(el("span", "", "Độ hợp gu:"));
  for (let v = 1; v <= 5; v++) {
    const x = el("button", "star", "★");
    x.type = "button";
    x.title = v + "/5 sao";
    x.onclick = () => {
      row.r[p.i] = v;
      s.querySelectorAll(".star").forEach((y, j) => y.classList.toggle("on", j < v));
      if (!panel.hidden) renderPanel();
    };
    s.appendChild(x);
  }
  c.appendChild(s);
  return c;
}

function track(r, text, ms) {
  const all = [...r.top, ...(r.explore ? [r.explore] : [])];
  const row = { q: text, v: cur, ms, r: {}, d: 0 };
  if (all.length) {
    row.d = new Set(all.map(p => B[p.i].g)).size / all.length;
    rows.push(row);
  }
  if (!panel.hidden) renderPanel();
  return row;
}

function localReply(text) {
  const t0 = performance.now();
  const r = recommend(text);
  const row = track(r, text, performance.now() - t0);
  add("bot", d => {
    d.append(r.intro);
    r.top.forEach(p => d.appendChild(card(p, false, row)));
    if (r.explore) d.appendChild(card(r.explore, true, row));
  });
}

// ================= TÍCH HỢP GEMINI API (CÓ EXPONENTIAL BACKOFF) =================
const SYS = "Bạn là Smart Library Curator – Người Giám Tuyển Thư Viện 4.0 thân thiện dành cho học sinh lớp 10. Chỉ gợi ý sách có trong KHO SÁCH bên dưới và ghi đúng tên sách. Mỗi lần gợi ý: 2–3 cuốn sát gu kèm lý do một câu dựa trên nhãn nội dung, cộng 1 cuốn “Bắc cầu Khám phá” khác danh mục với các cuốn còn lại để chống bong bóng lọc. Nếu thiếu thông tin thì hỏi lại tối đa 1 câu ngắn. Sách đánh dấu [NL] có nội dung trưởng thành: nhắc học sinh nên hỏi thủ thư hoặc thầy cô. Không hỏi hay lưu thông tin cá nhân. Không bịa nội dung sách ngoài các nhãn; nếu không chắc hãy nói rõ. Cuối câu trả lời nhắc ngắn rằng học sinh là người quyết định. Trả lời bằng tiếng Việt tự nhiên, dưới 170 từ, văn bản thuần không dùng markdown (không dùng ** hay #), dùng dấu • đầu dòng. Nếu học sinh nêu một bộ phim hoặc sách ngoài kho, hãy nói ngắn bạn hiểu tác phẩm đó nói về điều gì, rồi gợi ý sách trong kho có chủ đề tương tự.";
const CAT = B.map(b => "- " + b.t + " – " + b.a + " [" + b.g + "]" + (mature(b) ? " [NL]" : "") + ": " + b.k).join("\n");
const hist = [];
let busy = false;

async function callGemini(prompt, useJson = false) {
  const apiKey = "";
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{ parts: [{ text: prompt }] }],
    systemInstruction: { parts: [{ text: SYS }] }
  };
  if (useJson) {
    payload.generationConfig = {
      responseMimeType: "application/json",
      responseSchema: {
        type: "OBJECT",
        properties: {
          known: { type: "BOOLEAN" },
          what: { type: "STRING" },
          kw: { type: "ARRAY", items: { type: "STRING" } }
        },
        required: ["known", "what", "kw"]
      }
    };
  }

  let delay = 1000;
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const response = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const result = await response.json();
      const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("Empty response");
      return text;
    } catch (err) {
      if (attempt === 3) throw err;
      await new Promise(res => setTimeout(res, delay));
      delay *= 2;
    }
  }
}

async function send(text) {
  if (busy) return;
  busy = true;
  const qInput = document.getElementById("q");
  const sendBtn = document.getElementById("sendBtn");
  qInput.disabled = true;
  sendBtn.disabled = true;

  add("me", d => d.textContent = text);

  // Đo lường chỉ số hệ thống từ bộ máy gợi ý nội bộ
  const t0 = performance.now();
  const localRec = recommend(text);
  track(localRec, text, performance.now() - t0);

  let bub;
  const w = add("bot", d => {
    bub = d;
    d.classList.add("ai");
    d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  });

  try {
    const hint = localRec.top.map(p => B[p.i].t).join("; ");
    const prompt = "KHO SÁCH THƯ VIỆN:\n" + CAT +
      "\n\nGợi ý tham khảo từ thuật toán TF-IDF (bạn có thể dùng hoặc chọn cuốn phù hợp hơn trong kho): " + (hint || "(không có)") +
      "\n\nLịch sử hội thoại gần nhất:\n" + hist.slice(-6).map(h => (h.r === "u" ? "Học sinh: " : "Curator: ") + h.t).join("\n") +
      "\n\nHọc sinh: " + text + "\nCurator:";

    const replyText = await callGemini(prompt, false);
    bub.textContent = replyText.trim();
    bub.appendChild(el("div", "src", "🤖 Tư vấn bởi Gemini AI · Chỉ gợi ý sách có thật trong kho " + B.length + " đầu sách của thư viện."));
    hist.push({ r: "u", t: text }, { r: "c", t: replyText.trim() });
  } catch (e) {
    // Fallback mượt mà về thẻ sách tương tác nội bộ nếu mất kết nối AI
    w.remove();
    add("bot", d => d.textContent = "Kết nối AI đang tạm gián đoạn, mình sử dụng bộ máy tìm kiếm TF-IDF nội bộ để gợi ý ngay cho bạn nhé:");
    localReply(text);
  } finally {
    busy = false;
    qInput.disabled = false;
    sendBtn.disabled = false;
    qInput.focus();
  }
}

let qbusy = false;
async function quizResult() {
  if (qbusy) return;
  const res = document.getElementById("qres");
  res.textContent = "";

  const pk = Q.map((qq, qi) => [...sel[qi]].map(oi => qq.o[oi]));
  const fav = document.getElementById("fav").value.trim();
  const free = document.getElementById("free").value.trim();

  if (!fav && !free && !pk.slice(0, 4).some(a => a.length)) {
    res.appendChild(el("p", "hint", "Hãy chọn vài thẻ, nhập 1 tên sách/phim hoặc viết vài từ về gu đọc của bạn nhé!"));
    return;
  }

  qbusy = true;
  res.appendChild(el("p", "hint", "⏳ Người Giám Tuyển đang phân tích gu đọc và tìm sách trong kho…"));

  try {
    let kw = pk.slice(0, 4).flatMap((a, qi) => a.flatMap(x => qi === 1 ? [x[1], x[1]] : [x[1]])).join(" ");
    let note = "", favKw = "";
    if (free) kw += " " + free;

    if (fav) {
      kw += " giong " + fav;
      if (recommend(kw).intro.startsWith("Vì bạn thích")) {
        note = "📖 Mình nhận ra cuốn “" + fav + "” có sẵn trong kho nên đã đối chiếu trực tiếp DNA nội dung với các sách khác.";
      } else {
        try {
          const PR = `Học sinh lớp 10 thích tác phẩm: "${fav}" (có thể là sách hoặc phim). Hãy xác định đó là tác phẩm nào, rồi rút 6–10 từ khóa chủ đề hoặc thể loại ngắn gọn bằng tiếng Việt phản ánh đúng nội dung (ví dụ: trinh thám, phiêu lưu, tình cảm, khoa học viễn tưởng, vũ trụ, tuổi thơ, gia đình, tâm lý, lịch sử, triết lý, nghị lực, công nghệ). Nếu không chắc đó là tác phẩm nào thì đặt known=false và kw rỗng.`;
          const rawJson = await callGemini(PR, true);
          const j = JSON.parse(rawJson);
          if (j && j.known && Array.isArray(j.kw) && j.kw.length) {
            const k = j.kw.slice(0, 10).map(String);
            favKw = k.join(" ");
            note = "🎬 AI nhận diện tác phẩm “" + String(j.what || fav).slice(0, 80) + "” với các chủ đề cốt lõi: " + k.join(", ") + ".";
          } else {
            note = "Mình chưa nhận diện chắc chắn “" + fav + "”, nên ưu tiên gợi ý theo các thẻ bạn đã chọn.";
          }
        } catch (e) {
          note = "Tạm thời chưa kết nối được AI để phân tích “" + fav + "”, hệ thống gợi ý dựa trên các lựa chọn của bạn.";
        }
      }
    }

    const q2 = kw + (favKw ? " " + favKw + " " + favKw : "");
    const t0 = performance.now();
    const r = recommend(q2);
    const row = track(r, fav ? "Trắc nghiệm + " + fav : "Trắc nghiệm", performance.now() - t0);
    const wantNew = !pk[4].length || pk[4][0][1] === "yes";

    res.textContent = "";
    if (note) res.appendChild(el("p", "hint", note));
    if (!r.top.length) {
      res.appendChild(el("p", "hint", "Mình chưa tìm được sách khớp hoàn toàn. Thử chọn thêm thẻ khác nhé!"));
      return;
    }

    res.appendChild(el("h3", "", fav ? "🎯 Sách tại thư viện hợp gu “" + fav + "”" : "🎯 Đơn sách giám tuyển dành cho bạn"));
    r.top.forEach(p => res.appendChild(card(p, false, row)));
    if (wantNew && r.explore) res.appendChild(card(r.explore, true, row));

    const acts = el("div", "acts");
    const a = el("button", "chip", "💬 Nhờ AI giải thích sâu hơn");
    const b = el("button", "chip", "↺ Làm lại trắc nghiệm");
    a.type = b.type = "button";
    a.onclick = () => {
      showTab("chat");
      send(
        "Mình vừa làm trắc nghiệm gu đọc." +
        (fav ? " Mình mê tác phẩm “" + fav + "”." : "") +
        (free ? " Mô tả thêm: " + free + "." : "") +
        " Các thẻ đã chọn: " + pk.slice(0, 4).flat().map(x => x[0].replace(/^\S+\s/, "")).join("; ") +
        ". Hệ thống vừa gợi ý: " + r.top.map(p => B[p.i].t).join("; ") +
        ". Bạn hãy giải thích ngắn gọn vì sao những cuốn này hợp với mình nhé!"
      );
    };
    b.onclick = renderQuiz;
    acts.append(a, b);
    res.appendChild(acts);
    res.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } finally {
    qbusy = false;
  }
}
